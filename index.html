<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(160deg,#0b2545,#13315c 55%,#1b4f8a);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:360px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:28px 22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.ic{font-size:42px;text-align:center;margin-bottom:6px}

input[type=password]{width:100%;font-size:18px;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:#0b2545;outline:none}
input[type=password]:focus{border-color:#8ecae6;box-shadow:0 0 0 3px rgba(142,202,230,.4)}
label.rm{display:flex;align-items:center;gap:10px;margin:14px 2px;font-size:15px;opacity:.9;cursor:pointer}
label.rm input{width:20px;height:20px}
button{width:100%;font-size:18px;font-weight:600;padding:14px;border:0;border-radius:12px;background:#8ecae6;color:#0b2545;cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:22px;margin-top:12px;text-align:center;color:#ffb4a2;font-size:15px}

function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
